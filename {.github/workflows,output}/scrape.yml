name: Scrape & Deploy

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 10 * * *'
    - cron: '0 13 * * *'
    - cron: '0 16 * * *'
    - cron: '0 19 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium --with-deps

      - name: Restore DB from cache
        uses: actions/cache@v4
        with:
          path: holidaypirates_deals.db
          key: deals-db-${{ github.run_id }}
          restore-keys: |
            deals-db-

      - name: Run scraper
        run: python scraper.py --sources trivago airbnb booking

      - name: Build board
        run: python build_board.py --no-open

      - name: Save DB to cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: holidaypirates_deals.db
          key: deals-db-${{ github.run_id }}

      - name: Commit & push board
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add holidaypirates_board.html
          git diff --cached --quiet || git commit -m "chore: update board $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
